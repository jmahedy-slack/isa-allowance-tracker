<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISA Allowance Tracker — Ninety One</title>
<style>
  :root {
    --bg-primary: #0b0f19;
    --bg-card: #131a2a;
    --border: #1f2a40;
    --text: #e6ebf5;
    --muted: #8a97b1;
    --accent: #60a5fa;
    --danger: #f87171;
    --success: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-primary);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem;
  }
  header { margin-bottom: 1.5rem; max-width: 960px; }
  header .brand { color: var(--accent); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: .25rem 0 .35rem; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; max-width: 960px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 0 0 .35rem; }
  .field { margin-bottom: 1rem; }
  input[type=date], input[type=number] {
    width: 100%; padding: .55rem .7rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-primary); color: var(--text); font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button.primary {
    width: 100%; padding: .65rem 1rem; border: none; border-radius: 8px;
    background: var(--accent); color: #0b0f19; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.icon {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: .35rem .5rem; cursor: pointer; font-size: .75rem;
  }
  button.icon:hover { color: var(--danger); border-color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; padding: .5rem .4rem; border-bottom: 1px solid var(--border); }
  td { padding: .65rem .4rem; border-bottom: 1px solid var(--border); }
  tr.prev td { color: #5c677a; }
  tr.prev .badge { display: inline-block; font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; padding: .15rem .4rem; border-radius: 4px; background: #1a2235; color: var(--muted); margin-left: .5rem; }
  .empty { color: var(--muted); font-size: .9rem; padding: 1rem 0; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1rem; }
  @media (max-width: 520px) { .summary-grid { grid-template-columns: 1fr; } }
  .metric .label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .metric .value { font-size: 1.35rem; font-weight: 700; margin-top: .3rem; }
  .metric.used .value { color: var(--accent); }
  .metric.remaining .value { color: var(--success); }
  .metric.pct .value { color: var(--text); }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
  .ring-wrap svg { width: 180px; height: 180px; }
  .ring-center { font-size: 1.1rem; font-weight: 700; fill: var(--text); }
  .ring-sub { font-size: .65rem; fill: var(--muted); }
  .warning {
    display: none; text-align: center; color: var(--danger); font-weight: 600; font-size: .9rem;
    padding: .65rem; border-radius: 8px; background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .35);
  }
  .warning.show { display: block; }
  .allowance-cap { font-size: .8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand">Ninety One</div>
  <h1>ISA Allowance Tracker</h1>
  <p>Tax year 2026/27 · 6 Apr 2026 – 5 Apr 2027 · Annual allowance £20,000</p>
</header>

<div class="layout">
  <section>
    <div class="card" style="margin-bottom:1rem">
      <form id="addForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
          <div class="field">
            <label for="contribDate">Contribution date</label>
            <input id="contribDate" type="date" required>
          </div>
          <div class="field">
            <label for="contribAmount">Amount (£)</label>
            <input id="contribAmount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
          </div>
        </div>
        <button type="submit" class="primary">Add contribution</button>
      </form>
    </div>

    <div class="card">
      <h2 style="margin:0 0 .75rem;font-size:1rem;font-weight:600">Contributions</h2>
      <div id="listHost"></div>
    </div>
  </section>

  <aside class="card">
    <div class="summary-grid">
      <div class="metric used">
        <div class="label">Used</div>
        <div class="value" id="usedVal">£0</div>
      </div>
      <div class="metric remaining">
        <div class="label">Remaining</div>
        <div class="value" id="remainVal">£20,000</div>
      </div>
      <div class="metric pct">
        <div class="label">% of allowance</div>
        <div class="value" id="pctVal">0%</div>
      </div>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#1f2a40" stroke-width="10"/>
        <circle id="ringProgress" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="10"
          stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
        <text x="60" y="56" text-anchor="middle" class="ring-center" id="ringPct">0%</text>
        <text x="60" y="72" text-anchor="middle" class="ring-sub">of £20k</text>
      </svg>
      <div class="allowance-cap">£20,000 ISA allowance</div>
      <div class="warning" id="overWarning"></div>
    </div>
  </aside>
</div>

<script id="isa-allowance">
const DEFAULT_ISA_ALLOWANCE = 20000;
const TAX_YEAR_2026_27 = {
  label: "2026/27",
  start: { y: 2026, m: 4, d: 6 },
  end: { y: 2027, m: 4, d: 5 },
};

function dateFromParts({ y, m, d }) {
  return new Date(y, m - 1, d);
}

function parseIsoDateLocal(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return dateFromParts({ y, m, d });
}

function isDateInTaxYear(date, taxYear = TAX_YEAR_2026_27) {
  const start = dateFromParts(taxYear.start);
  const end = dateFromParts(taxYear.end);
  end.setHours(23, 59, 59, 999);
  return date >= start && date <= end;
}

function calculateIsaAllowance(contributions, options = {}) {
  const allowance = options.allowance ?? DEFAULT_ISA_ALLOWANCE;
  const taxYear = options.taxYear ?? TAX_YEAR_2026_27;
  let used = 0;
  const rows = contributions.map((c) => {
    const inCurrentTaxYear = isDateInTaxYear(parseIsoDateLocal(c.date), taxYear);
    if (inCurrentTaxYear) used += c.amount;
    return { ...c, inCurrentTaxYear };
  });
  const remaining = Math.max(0, allowance - used);
  const pctUsed = allowance > 0 ? (used / allowance) * 100 : 0;
  const overBy = Math.max(0, used - allowance);
  return { used, remaining, pctUsed, overBy, allowance, rows };
}

if (typeof module !== "undefined") {
  module.exports = { calculateIsaAllowance, isDateInTaxYear, parseIsoDateLocal, TAX_YEAR_2026_27, DEFAULT_ISA_ALLOWANCE };
}
</script>
<script>
const RING_C = 2 * Math.PI * 52;
const fmt = (n) => n.toLocaleString("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 0 });
const fmtPct = (n) => `${Math.round(n)}%`;

let contributions = [];
let nextId = 1;

function render() {
  const { used, remaining, pctUsed, overBy, rows } = calculateIsaAllowance(contributions);
  document.getElementById("usedVal").textContent = fmt(used);
  document.getElementById("remainVal").textContent = fmt(remaining);
  document.getElementById("pctVal").textContent = fmtPct(pctUsed);

  const ring = document.getElementById("ringProgress");
  const fill = Math.min(pctUsed / 100, 1);
  ring.setAttribute("stroke-dashoffset", String(RING_C * (1 - fill)));
  ring.setAttribute("stroke", overBy > 0 ? "var(--danger)" : "var(--accent)");
  document.getElementById("ringPct").textContent = fmtPct(pctUsed);

  const warn = document.getElementById("overWarning");
  if (overBy > 0) {
    warn.textContent = `Over allowance by ${fmt(overBy)}`;
    warn.classList.add("show");
  } else {
    warn.classList.remove("show");
  }

  const host = document.getElementById("listHost");
  if (!rows.length) {
    host.innerHTML = '<p class="empty">No contributions yet. Add a dated payment to track allowance usage.</p>';
    return;
  }

  const sorted = [...rows].sort((a, b) => a.date.localeCompare(b.date));
  host.innerHTML = `<table><thead><tr><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>${sorted.map((r) => {
    const id = r.id;
    const prev = !r.inCurrentTaxYear;
    return `<tr class="${prev ? "prev" : ""}"><td>${r.date}${prev ? '<span class="badge">Previous tax year</span>' : ""}</td><td>${fmt(r.amount)}</td><td style="text-align:right"><button type="button" class="icon" data-del="${id}" aria-label="Delete">Delete</button></td></tr>`;
  }).join("")}</tbody></table>`;

  host.querySelectorAll("[data-del]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = Number(btn.getAttribute("data-del"));
      contributions = contributions.filter((c) => c.id !== id);
      render();
    });
  });
}

document.getElementById("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const date = document.getElementById("contribDate").value;
  const amount = Number(document.getElementById("contribAmount").value);
  if (!date || !(amount > 0)) return;
  contributions.push({ id: nextId++, date, amount });
  document.getElementById("contribAmount").value = "";
  render();
});

document.getElementById("contribDate").value = "2026-10-01";
render();
</script>
</body>
</html>
